name: Docs checks

on:
  pull_request:
  push:
    branches: [main, nightly]

jobs:
  docs-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sitemap <lastmod> is derived from per-file git history. A shallow
          # checkout collapses every file to the same commit date, which the
          # build detects and responds to by omitting the dates entirely.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and verify the docs bundle
        run: npm run docs:test
